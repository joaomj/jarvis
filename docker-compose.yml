services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis
    env_file:
      - .env
    volumes:
      - .:/app/project
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
