name: CI

on:
  push:
    branches:
      - ${{ github.default_branch }}
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true
          cache-dependency-path: pdm.lock

      - name: Install dependencies
        run: pdm install -G dev

      - name: Ruff lint
        run: pdm run ruff check .

      - name: Ruff format check
        run: pdm run ruff format --check .

      - name: Mypy type check
        run: pdm run mypy src/jarvis/deep_research.py

      - name: Run fast and integration tests
        run: pdm run pytest -m "fast or integration"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  e2e-opencode:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true
          cache-dependency-path: pdm.lock

      - name: Install dependencies
        run: pdm install -G dev

      - name: Run e2e opencode smoke tests
        env:
          JARVIS_ENABLE_E2E_OPENCODE: "1"
          JARVIS_E2E_OPENCODE_URL: ${{ secrets.JARVIS_E2E_OPENCODE_URL }}
          JARVIS_E2E_OPENCODE_PASSWORD: ${{ secrets.JARVIS_E2E_OPENCODE_PASSWORD }}
        run: pdm run pytest -m e2e_opencode -v
